[build-system]
requires = [
    "hatchling",
    "hatch-zipped-directory",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gitwebhooklambda"
]

[tool.hatch.build.targets.zipped-directory]
install-name = "gitwebhooklambda"
sources = [
    "/src",
]

[project]
name = "git-webhook-lambda"
version = "0.1.0"
description = "Lambda Handler for AWS integrations"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.34",
    "requests>2.32",
    "pytest"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--import-mode=importlib"
]
testpaths = [
    "tests/unit"
]
pythonpath = "src"